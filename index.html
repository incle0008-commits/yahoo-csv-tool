/* ---------- 9. EVENT HANDLERS ---------- */

let dragImgId = null;

function attachEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.getAttribute('data-action');
    if(action==='thumb-drag') return;
    const evt = (el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA')
      ? (el.type==='checkbox' || el.tagName==='SELECT' ? 'change' : 'input')
      : 'click';
    el.addEventListener(evt, (e)=>handleAction(action, el, e));
  });

  const dz = document.getElementById('dropzone');
  if(dz){
    dz.addEventListener('dragover', (e)=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', (e)=>{ e.preventDefault(); dz.classList.remove('drag'); handleFiles(e.dataTransfer.files); });
  }
  const fi = document.getElementById('file-input');
  if(fi) fi.addEventListener('change', (e)=>handleFiles(e.target.files));

  app.querySelectorAll('.thumb[data-action="thumb-drag"]').forEach(el=>{
    el.addEventListener('dragstart', (e)=>{ dragImgId = el.getAttribute('data-imgid'); el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragImgId=null; });
    el.addEventListener('dragover', (e)=>e.preventDefault());
    el.addEventListener('drop', (e)=>{
      e.preventDefault();
      const targetId = el.getAttribute('data-imgid');
      if(!dragImgId || dragImgId===targetId) return;
      const p = selectedProduct();
      if(!p) return;
      const fromIdx = p.images.findIndex(i=>i.id===dragImgId);
      const toIdx = p.images.findIndex(i=>i.id===targetId);
      if(fromIdx<0 || toIdx<0) return;
      const [moved] = p.images.splice(fromIdx,1);
      p.images.splice(toIdx,0,moved);
      scheduleSaveProduct(p.id); render();
    });
  });
}

async function handleFiles(fileList){
  const p = selectedProduct();
  if(!p) return;
  const files = Array.from(fileList||[]).filter(f=>/image\/(jpeg|jpg|png|webp)/.test(f.type));
  if(!files.length){ showToast('対応形式は JPG / PNG / WEBP です'); return; }
  const room = 10 - p.images.length;
  if(room<=0){ showToast('画像は最大10枚までです'); return; }
  const toProcess = files.slice(0, room);
  showToast(toProcess.length + '枚の画像を読み込んでいます…');
  for(const file of toProcess){
    try{
      const dataUrl = await resizeImageFile(file, 1000, 0.75);
      const img = { id: uid('img'), dataUrl, isMain: p.images.length===0, storagePath: null, downloadURL: null };
      p.images.push(img);
      uploadImageToCloud(p, img); // バックグラウンドでクラウドへアップロード（完了後に自動保存）
    }catch(e){
      console.error(e);
      showToast('画像の読み込みに失敗しました: ' + file.name);
    }
  }
  scheduleSaveProduct(p.id); render();
}

function handleAction(action, el, e){
  const p = selectedProduct();
  switch(action){
    case 'add-product': {
      const np = newProduct();
      state.products.push(np);
      state.selectedProductId = np.id;
      state.activeTab = 'images';
      state.view = 'editor';
      createProductInCloud(np); render();
      break;
    }
    case 'delete-product': {
      e.stopPropagation();
      state.confirmDeleteId = el.getAttribute('data-id');
      render();
      break;
    }
    case 'cancel-delete-product': {
      state.confirmDeleteId = null;
      render();
      break;
    }
    case 'confirm-delete-product': {
      const id = state.confirmDeleteId;
      const removed = state.products.find(x=>x.id===id);
      state.products = state.products.filter(x=>x.id!==id);
      state.selectedForExport.delete(id);
      if(state.selectedProductId===id) state.selectedProductId = state.products.length ? state.products[0].id : null;
      state.confirmDeleteId = null;
      if(removed){
        removed.images.forEach(deleteImageFromCloud); // ベストエフォート（失敗しても致命的ではない）
        deleteProductFromCloud(removed);
      }
      render();
      showToast('商品を削除しました');
      break;
    }
    case 'select-product': state.selectedProductId = el.getAttribute('data-id'); state.view='editor'; render(); break;
    case 'edit-from-confirm': state.selectedProductId = el.getAttribute('data-id'); state.view='editor'; state.activeTab='ai'; render(); break;
    case 'set-tab': state.activeTab = el.getAttribute('data-tab'); render(); break;
    case 'goto-csv': state.view='csv'; render(); break;
    case 'back-to-editor': state.view='editor'; render(); break;
    case 'open-settings': state.settingsOpen=true; render(); break;
    case 'close-settings':
    case 'close-settings-overlay': {
      if(action==='close-settings-overlay' && e.target!==el) return;
      state.settingsOpen=false; render();
      break;
    }
    case 'set-settings-tab': state.settingsTab = el.getAttribute('data-tab'); render(); break;
    case 'open-desc-preview': state.descPreviewOpen=true; state.descPreviewMode='render'; render(); break;
    case 'close-desc-preview':
    case 'close-desc-preview-overlay': {
      if(action==='close-desc-preview-overlay' && e.target!==el) return;
      state.descPreviewOpen=false; render();
      break;
    }
    case 'desc-preview-mode': state.descPreviewMode = el.getAttribute('data-mode'); render(); break;
    case 'set-main-image': {
      if(!p) return;
      const imgid = el.getAttribute('data-imgid');
      p.images.forEach(im=>im.isMain=(im.id===imgid));
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'delete-image': {
      if(!p) return;
      const imgid = el.getAttribute('data-imgid');
      const wasMain = p.images.find(im=>im.id===imgid && im.isMain);
      const removedImg = p.images.find(im=>im.id===imgid);
      p.images = p.images.filter(im=>im.id!==imgid);
      if(wasMain && p.images.length) p.images[0].isMain = true;
      if(removedImg) deleteImageFromCloud(removedImg); // ベストエフォート
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'run-ai': {
      if(!p) return;
      runAiAnalysis(p).then(ok=>showToast(ok ? 'AI解析が完了しました' : 'AI解析に失敗しました。手動入力してください'));
      break;
    }
    case 'run-batch': runBatchAnalysis(); break;
    case 'close-batch': state.batch=null; render(); break;
    case 'edit-mgmt': { if(!p) return; p.managementNumber = el.value; regenerateAll(p); scheduleSaveProduct(p.id); break; }
    case 'edit-enddate': { if(!p) return; p.endDate = el.value; scheduleSaveProduct(p.id); break; }
    case 'edit-info': {
      if(!p) return;
      p.info[el.getAttribute('data-key')] = el.value;
      p.confidence[el.getAttribute('data-key')] = null; // 手動修正時は信頼度表示をクリア
      regenerateAll(p);
      scheduleSaveProduct(p.id);
      break;
    }
    case 'edit-category': {
      if(!p) return;
      p.categoryId = el.value;
      p.categoryConfidence = null;
      p.categoryReasoning = '';
      regenerateAll(p); // カテゴリーによって商品名・説明文のテンプレートが変わるため再生成する
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'set-ok-ng': {
      if(!p) return;
      p[el.getAttribute('data-key')] = el.getAttribute('data-value');
      regenerateAll(p);
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'edit-vacuum-note': {
      if(!p) return;
      p.vacuumNote = el.value;
      regenerateAll(p);
      scheduleSaveProduct(p.id);
      break;
    }
    case 'edit-rice-capacity': {
      if(!p) return;
      p.riceCookerCapacity = el.value;
      if(!p.shippingSizeManual){
        const autoSize = capacityToShippingSize(p.riceCookerCapacity);
        if(autoSize) p.shippingSize = autoSize;
      }
      regenerateAll(p);
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'edit-shipping-size': {
      if(!p) return;
      p.shippingSize = el.value;
      p.shippingSizeManual = true; // 手動変更した以上、以後は合数変更で自動上書きしない
      regenerateAll(p);
      scheduleSaveProduct(p.id); render();
      break;
    }
    case 'edit-rice-note': {
      if(!p) return;
      p.riceCookerNote = el.value;
      regenerateAll(p);
      scheduleSaveProduct(p.id);
      break;
    }
    case 'edit-title': { if(!p) return; p.title = el.value; p.description = renderDescription(p); scheduleSaveProduct(p.id); break; }
    case 'regen-title': { if(!p) return; p.title = generateTitle(p); p.description = renderDescription(p); scheduleSaveProduct(p.id); render(); break; }
    case 'copy-title': { if(!p) return; navigator.clipboard && navigator.clipboard.writeText(p.title).then(()=>showToast('商品名をコピーしました')).catch(()=>{}); break; }
    case 'regen-description': { if(!p) return; p.description = renderDescription(p); scheduleSaveProduct(p.id); render(); showToast('商品説明を現在の商品名に同期しました'); break; }
    case 'edit-description': { if(!p) return; p.description = el.value; scheduleSaveProduct(p.id); break; }
    case 'set-charset': state.settings.csvCharset = el.value; scheduleSaveSettings(); break;
    case 'toggle-include-images': state.settings.includeImagesInCsv = el.checked; scheduleSaveSettings(); render(); break;
    case 'edit-csv-image-count': {
      let v = parseInt(el.value,10);
      if(isNaN(v)) v = 10;
      v = Math.max(1, Math.min(10, v));
      state.settings.csvImageCount = v;
      scheduleSaveSettings(); render();
      break;
    }
    case 'download-csv': downloadCsv(); break;
    case 'download-image-zip': downloadImageFolderZip(); break;
    case 'download-auctown-zip': downloadAuctownReadyZip(); break;
    case 'google-sign-in': signInWithGoogle(); break;
    case 'sign-out': signOutUser(); break;
    case 'show-exported-list': {
      state.hideExportedFromList = false;
      render();
      break;
    }
    case 'set-filter': {
      state.filterMode = el.getAttribute('data-filter');
      render();
      break;
    }
    case 'toggle-select-export': {
      const pid = el.getAttribute('data-id');
      if(el.checked) state.selectedForExport.add(pid);
      else state.selectedForExport.delete(pid);
      render();
      break;
    }
    case 'select-all-visible': {
      getFilteredProducts().forEach(p => state.selectedForExport.add(p.id));
      render();
      break;
    }
    case 'deselect-all': {
      state.selectedForExport.clear();
      render();
      break;
    }
    case 'export-selected-zip': handleExportSelectedZip(); break;
    case 'reexport-confirm': {
      const targets = (state.reexportConfirmIds || []).map(id => getProduct(id)).filter(Boolean);
      state.reexportConfirmIds = null;
      render();
      downloadAuctownReadyZip(targets);
      break;
    }
    case 'reexport-cancel': {
      state.reexportConfirmIds = null;
      render();
      break;
    }
    case 'save-image-folder-direct': saveImageFolderDirect(); break;
    case 'edit-fixed-value': {
      state.settings.fixedValues[el.getAttribute('data-key')] = el.value;
      scheduleSaveSettings();
      break;
    }
    case 'edit-title-template': {
      state.settings.titleTemplate = el.value;
      state.products.forEach(p => { regenerateAll(p); scheduleSaveProduct(p.id); });
      scheduleSaveSettings();
      break;
    }
    case 'edit-mgmt-prefix': {
      state.settings.managementNumberPrefix = el.value;
      state.products.forEach(p => { regenerateAll(p); scheduleSaveProduct(p.id); });
      scheduleSaveSettings();
      break;
    }
    case 'ai-test': {
      const resultEl = document.getElementById('ai-test-result');
      if(!hasGeminiApiKey()){
        if(resultEl) resultEl.textContent = '✗ APIキーが未入力です';
        break;
      }
      if(resultEl) resultEl.textContent = '接続確認中…';
      fetch(geminiEndpoint(), {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:'ok' }] }] })
      }).then(async r=>{
        if(!resultEl) return;
        if(r.ok){ resultEl.textContent = '✓ Gemini APIへの接続に成功しました'; }
        else{ resultEl.textContent = '接続失敗: ' + (await describeGeminiError(r)); }
      }).catch(()=>{ if(resultEl) resultEl.textContent = '接続失敗（ネットワークエラー）'; });
      break;
    }
    case 'edit-gemini-key': {
      state.settings.geminiApiKey = el.value;
      scheduleSaveSettings();
      break;
    }
    default: break;
  }
}

/* ---------- 10. 一括AI解析（進捗表示） ---------- */

// Concurrency Pool方式：常に最大 concurrency 件を同時実行し、1件終わり次第すぐ次を投入する
// （100〜1000件をPromise.allで一気に投げるようなことはしない）。
async function runWithConcurrency(items, worker, concurrency){
  let index = 0;
  async function runner(){
    while(true){
      const currentIndex = index++;
      if(currentIndex >= items.length) return;
      await worker(items[currentIndex], currentIndex);
    }
  }
  const workers = [];
  for(let i = 0; i < Math.min(concurrency, items.length); i++){
    workers.push(runner());
  }
  await Promise.all(workers);
}

async function runBatchAnalysis(){
  // aiStatus==='done' の商品は対象外（再解析はしない）。'loading'中の商品もWorker Poolの
  // 対象から自然に除外される（idle/errorのみを最初にリストアップするため、二重解析は起きない）。
  const targets = state.products.filter(p => p.aiStatus === 'idle' || p.aiStatus === 'error');
  if(!targets.length){ showToast('解析対象の商品がありません'); return; }
  if(!hasGeminiApiKey()){ showToast('AI解析にはGoogle Gemini APIキーの設定が必要です（設定 → AI設定）'); return; }

  state.batch = { running:true, index:0, total: targets.length, stage:'AI解析中…（最大' + AI_CONCURRENCY + '件を同時処理）', log:[] };
  render();

  let completed = 0, errorCount = 0;
  let lastRenderAt = 0;
  const BATCH_RENDER_INTERVAL_MS = 250;
  function throttledRender(force){
    const now = Date.now();
    if(force || now - lastRenderAt >= BATCH_RENDER_INTERVAL_MS){
      lastRenderAt = now;
      render();
    }
  }

  await runWithConcurrency(targets, async (p) => {
    const ok = await runAiAnalysis(p, { maxImages: AI_MAX_IMAGES_BATCH, silent: true }); // 一括解析は速度優先で最大5枚・render()は間引く
    completed++;
    if(ok){
      state.batch.log.unshift('✓ ' + (p.title || formatManagementNumber(p.managementNumber) || p.id) + ' の解析が完了しました');
    }else{
      errorCount++;
      state.batch.log.unshift('✕ ' + (formatManagementNumber(p.managementNumber) || p.id) + ' の解析に失敗しました（' + (p.aiError || '手動入力が必要です') + '）');
    }
    if(state.batch.log.length > 200) state.batch.log.length = 200; // ログ肥大化によるUI遅延を防ぐ
    state.batch.index = completed;
    throttledRender();
  }, AI_CONCURRENCY);

  state.batch.running = false;
  state.batch.stage = '完了しました';
  throttledRender(true); // 最終結果は必ず描画する
  showToast('一括解析が完了しました（成功 ' + (completed - errorCount) + '件 / エラー ' + errorCount + '件）');
}

/* ---------- 11. INIT ---------- */

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<div style="padding:60px;text-align:center;color:#8b8f9c;">読み込み中…</div>';

  if(typeof firebase === 'undefined'){
    state.authState = 'needs-setup';
    render();
    return;
  }
  if(!initFirebase()){
    state.authState = 'needs-setup';
    render();
    return;
  }

  state.deviceId = getOrCreateDeviceId();

  fbAuth.onAuthStateChanged(async (user) => {
    if(user){
      state.authUser = { uid: user.uid, displayName: user.displayName, email: user.email, photoURL: user.photoURL };
      state.authState = 'ready';
      render();
      subscribeToProducts();
      subscribeToSettings();
    }else{
      state.authUser = null;
      state.products = [];
      state.authState = 'signed-out';
      render();
    }
  });
}
init();
</script>
