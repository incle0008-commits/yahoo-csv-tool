<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中古家電 出品管理システム</title>
<style>
:root{
  --bg:#f3f4f5; --surface:#ffffff; --surface-2:#eef0f2;
  --ink:#22262b; --ink-soft:#52585f; --ink-faint:#8a9099;
  --line:#dfe2e5; --line-strong:#c5cad0;
  --accent:#33587e; --accent-dark:#25415f; --accent-soft:#e3ebf2;
  --success:#3d7a4a; --success-soft:#e4efe6;
  --warn:#93641e; --warn-soft:#f3e9d6;
  --danger:#a23f38; --danger-soft:#f4e3e1;
  --radius-s:2px; --radius-m:3px;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);}
::selection{background:var(--accent-soft);}
#app{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--surface);color:var(--ink);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line-strong);}
.brand-mark{display:flex;align-items:baseline;gap:10px;}
.version-badge{font-family:var(--mono);font-size:10px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:2px;padding:1px 6px;white-space:nowrap;}
.topbar h1{font-family:var(--disp);font-weight:700;font-size:15px;margin:0;color:var(--ink);}
.topbar .sub{color:var(--ink-faint);font-size:11.5px;margin-top:1px;}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.icon-btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:var(--radius-s);padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:5px;}
.icon-btn:hover{border-color:var(--ink-soft);background:var(--surface-2);}
.icon-btn.hi{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.progress-strip{background:var(--surface-2);border-bottom:1px solid var(--line);padding:6px 18px;display:flex;overflow-x:auto;}
.progress-step{display:flex;align-items:center;gap:6px;padding:2px 12px 2px 0;color:var(--ink-faint);font-size:11px;white-space:nowrap;flex:none;}
.progress-step .n{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-family:var(--mono);font-weight:600;flex:none;}
.progress-step.active{color:var(--ink);font-weight:600;}
.progress-step.active .n{background:var(--accent);border-color:var(--accent);color:#fff;}
.progress-step.done .n{background:var(--ink-faint);border-color:var(--ink-faint);color:#fff;}
.progress-step:after{content:'';width:16px;height:1px;background:var(--line-strong);margin-left:6px;}
.progress-step:last-child:after{display:none;}
.main-shell{flex:1;display:flex;min-height:0;}
.sidebar{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;}
.sidebar-head{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.sidebar-head h2{font-size:11.5px;margin:0;color:var(--ink-soft);font-weight:700;}
.add-product-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:var(--radius-s);padding:7px;margin:8px 10px 4px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;}
.add-product-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.product-list{flex:1;overflow-y:auto;padding:2px 6px 8px;}
.product-item{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:var(--radius-s);cursor:pointer;border:1px solid transparent;margin-bottom:1px;}
.product-item:hover{background:var(--surface-2);}
.product-item.selected{background:var(--accent-soft);border-color:var(--accent);}
.product-thumb{width:32px;height:32px;border-radius:var(--radius-s);background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:8px;}
.product-item-text{flex:1;min-width:0;}
.product-item-title{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-item-meta{font-size:10.5px;color:var(--ink-faint);}
.status-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.status-dot.ok{background:var(--success);}
.status-dot.warn{background:var(--warn);}
.status-dot.err{background:var(--danger);}
.product-item .del-btn{border:none;background:transparent;color:var(--ink-faint);font-size:13px;padding:2px 4px;flex:none;}
.product-item .del-btn:hover{color:var(--danger);}
.sidebar-foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:5px;}
.sidebar-foot button{width:100%;padding:7px;border-radius:var(--radius-s);font-size:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);text-align:left;display:flex;align-items:center;gap:6px;}
.sidebar-foot button:hover{border-color:var(--ink-soft);color:var(--ink);}
.sidebar-foot button.primary{background:var(--ink);color:#fff;border-color:var(--ink);justify-content:center;font-weight:600;}
.sidebar-foot button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.main-panel{flex:1;overflow-y:auto;padding:14px 18px 40px;}
.panel-empty{max-width:420px;margin:60px auto;text-align:center;color:var(--ink-faint);}
.panel-empty .stamp-lg{display:none;}
.tabbar{display:flex;gap:0;border-bottom:1px solid var(--line-strong);margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:12.5px;color:var(--ink-faint);font-weight:600;}
.tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);}
.tab-btn:hover{color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;}
.card h3{font-family:var(--disp);font-size:12.5px;font-weight:700;margin:0 0 3px;color:var(--ink);}
.card .card-desc{font-size:11.5px;color:var(--ink-faint);margin:0 0 10px;}
.field-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.field{flex:1;min-width:160px;}
.field label{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-s);background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);outline-offset:0;border-color:var(--accent);}
.field textarea{resize:vertical;min-height:60px;line-height:1.6;}
.prefixed-input{display:flex;align-items:stretch;}

.prefixed-input .prefix-chip{display:flex;align-items:center;padding:0 10px;background:var(--surface-2);border:1px solid var(--line-strong);border-right:none;border-radius:var(--radius-s) 0 0 var(--radius-s);color:var(--ink-soft);font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap;}
.prefixed-input input{border-radius:0 var(--radius-s) var(--radius-s) 0 !important;}
.hint{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
.hint.warn{color:var(--warn);}
.dropzone{border:1px dashed var(--line-strong);border-radius:var(--radius-s);background:var(--surface-2);padding:20px;text-align:center;color:var(--ink-soft);margin-bottom:10px;transition:border-color .15s,background .15s;}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
.dropzone .dz-title{font-weight:700;font-size:12.5px;color:var(--ink);margin-bottom:3px;}
.dropzone .dz-sub{font-size:11px;color:var(--ink-faint);margin-bottom:10px;}
.file-btn{display:inline-block;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);padding:6px 14px;border-radius:var(--radius-s);font-size:12px;font-weight:600;}
.file-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
.thumb-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.thumb{width:92px;position:relative;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:#fff;cursor:grab;}
.thumb.dragging{opacity:.35;}
.thumb img{width:100%;height:92px;object-fit:cover;display:block;pointer-events:none;}
.thumb .thumb-actions{display:flex;justify-content:space-between;align-items:center;padding:3px 4px;background:var(--surface-2);border-top:1px solid var(--line);}
.thumb button{border:none;background:transparent;font-size:10px;color:var(--ink-soft);padding:2px 3px;}
.thumb button:hover{color:var(--danger);}
.thumb button.mainbtn:hover{color:var(--accent-dark);}
.thumb .main-badge{position:absolute;top:3px;left:3px;background:var(--ink);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;font-weight:600;}
.thumb .order-badge{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;}
.btn{padding:6px 12px;border-radius:var(--radius-s);font-size:12px;font-weight:600;border:1px solid var(--line-strong);background:#fff;color:var(--ink);}
.btn:hover{border-color:var(--ink-soft);background:var(--surface-2);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.accent:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn.ghost:hover{color:var(--ink);text-decoration:underline;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.char-counter{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:900px){.info-grid{grid-template-columns:repeat(2,1fr);}}
.confidence{font-size:10px;font-family:var(--mono);padding:1px 5px;border-radius:2px;margin-left:5px;border:1px solid transparent;}
.confidence.high{background:var(--success-soft);color:var(--success);}
.confidence.mid{background:var(--warn-soft);color:var(--warn);}
.confidence.low{background:var(--danger-soft);color:var(--danger);}
.filter-chip-row{display:flex;gap:5px;flex-wrap:wrap;}
.filter-chip{font-size:11.5px;padding:5px 10px;border-radius:var(--radius-s);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);font-weight:600;}
.filter-chip:hover{border-color:var(--ink-soft);}
.filter-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.export-badge{font-size:10px;padding:1px 6px;border-radius:2px;font-weight:700;white-space:nowrap;border:1px solid transparent;}
.export-badge.exported{background:var(--success-soft);color:var(--success);}
.export-badge.unexported{background:var(--warn-soft);color:var(--warn);}
.mine-badge{font-size:10px;padding:1px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;border:1px solid var(--line);}
.ai-status-banner{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-s);font-size:12px;margin-bottom:10px;}
.ai-status-banner.loading{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.ai-status-banner.done{background:var(--success-soft);color:var(--success);}
.ai-status-banner.error{background:var(--danger-soft);color:var(--danger);}
.ai-status-banner.idle{background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line);}
.spinner{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--ink-soft);animation:spin .7s linear infinite;flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:var(--danger-soft);border:1px solid var(--danger);border-left-width:3px;border-radius:var(--radius-s);padding:8px 12px;margin-bottom:10px;}
.error-box h4{margin:0 0 4px;font-size:11.5px;color:var(--danger);}
.error-box ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink);}
.warn-box{background:var(--warn-soft);border:1px solid var(--warn);border-left-width:3px;border-radius:var(--radius-s);padding:8px 12px;margin-bottom:10px;}
.warn-box h4{margin:0 0 4px;font-size:11.5px;color:var(--warn);}
.warn-box ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink);}
.batch-banner{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);padding:8px 12px;border-radius:var(--radius-s);margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.batch-banner .stage{font-weight:700;}
.batch-log{max-height:110px;overflow-y:auto;font-size:11px;color:var(--ink-soft);width:100%;margin-top:4px;font-family:var(--mono);}
.batch-log div{padding:1px 0;}
.confirm-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 14px;margin-bottom:8px;background:#fff;}
.confirm-card.err{border-color:var(--danger);border-left-width:3px;background:var(--danger-soft);}
.confirm-card .cc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
.confirm-card .cc-head h4{margin:0;font-size:12.5px;font-family:var(--disp);font-weight:700;}
.confirm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px;font-size:12px;}
@media(max-width:900px){.confirm-grid{grid-template-columns:1fr 1fr;}}
.confirm-grid dt{color:var(--ink-faint);font-size:10.5px;margin-bottom:1px;}
.confirm-grid dd{margin:0 0 5px;font-weight:600;word-break:break-word;}
.csv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;max-height:420px;}
table.csv-table{border-collapse:collapse;width:100%;font-size:11px;}
table.csv-table th,table.csv-table td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
table.csv-table th{background:var(--surface-2);font-weight:700;color:var(--ink-soft);position:sticky;top:0;}
table.csv-table tr.row-error td{background:var(--danger-soft);}
table.csv-table tr.row-warn td{background:var(--warn-soft);}
table.csv-table td.rowlabel{font-weight:700;white-space:normal;position:sticky;left:0;background:#fff;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,22,30,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:var(--radius-m);width:100%;max-width:820px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.18);border:1px solid var(--line-strong);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);}
.modal-head h2{font-family:var(--disp);font-size:13.5px;font-weight:700;margin:0;}
.modal-close{border:none;background:transparent;font-size:16px;color:var(--ink-faint);}
.modal-close:hover{color:var(--ink);}
.modal-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1;}
.mini-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
.mini-table th{text-align:left;font-size:10.5px;color:var(--ink-faint);padding:4px 6px;border-bottom:1px solid var(--line);}
.mini-table td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle;}
.mini-table input[type=text]{width:100%;padding:5px 7px;border:1px solid var(--line-strong);border-radius:var(--radius-s);}
.small-btn{font-size:10.5px;padding:4px 8px;border-radius:var(--radius-s);border:1px solid var(--line-strong);background:#fff;}
.small-btn:hover{border-color:var(--ink-soft);}
.small-btn.danger{color:var(--danger);border-color:var(--danger);}
.small-btn.danger:hover{background:var(--danger-soft);}
.preview-toggle{display:flex;gap:5px;margin-bottom:8px;}
.preview-frame{width:100%;height:60vh;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff;}
.preview-raw{width:100%;height:60vh;font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:8px;white-space:pre-wrap;overflow:auto;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:var(--radius-s);font-size:12px;z-index:200;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-3px);}
@media(max-width:820px){
  .main-shell{flex-direction:column;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:220px;}
  .main-panel{padding:12px;}
  .info-grid{grid-template-columns:1fr 1fr;}
  .confirm-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js" onerror="window.__sjisUnavailable=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" onerror="window.__jszipUnavailable=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__supabaseUnavailable=true"></script>
<script>
/* =========================================================================
   ヤフオク・オークタウン用 CSV出品データ自動作成ツール
   構成:
     1. CONFIG / DEFAULTS（CSV列定義=CSV_COLUMNS、固定HTML説明テンプレート=DESCRIPTION_TEMPLATE）
     2. STATE
     3. PERSISTENCE (window.storage)
     4. UTILITIES
     5. AI 認識（型番・メーカー・製造年、信頼度つき）
     6. 商品名生成 / 説明文「貼り付け！」置換エンジン
     7. CSV 生成エンジン（列順・列数を完全固定）
     8. RENDER
     9. EVENT HANDLERS
    10. 一括AI解析（進捗表示）
    11. INIT

   設計方針（最重要）:
     - AIの仕事は「型番・メーカー・製造年の画像認識」のみ。HTMLは一切生成させない。
     - 商品説明はDESCRIPTION_TEMPLATE定数（固定HTML）を一切書き換えず、
       "貼り付け！" という文字列だけをプログラム側で商品名に置換する。
     - CSVの列定義はCSV_COLUMNSという1つの配列に分離。列の追加・削除・並び替えは
       この配列を編集しない限り発生しない（UI上からは列順を変更できない）。
   ========================================================================= */

/* ---------- 1. CONFIG / DEFAULTS ---------- */

// CSV列定義。key=内部キー, header=CSV出力時の列名, type='fixed'(固定値)|'title'|'description'
// 列の順序・数は仕様により完全固定。固定値のみ設定画面から変更可能。
const CSV_COLUMNS = [
  { key:'category',            header:'カテゴリ',                 type:'category' },
  { key:'title',                header:'タイトル',                 type:'title' },
  { key:'description',          header:'説明',                     type:'description' },
  { key:'startPrice',           header:'開始価格',                 type:'fixed', default:'1000' },
  { key:'qty',                  header:'個数',                     type:'fixed', default:'1' },
  { key:'duration',             header:'開催期間',                 type:'fixed', default:'3' },
  { key:'endHour',              header:'終了時間',                 type:'fixed', default:'21' },
  { key:'shipFromPref',         header:'商品発送元の都道府県',     type:'fixed', default:'兵庫県' },
  { key:'shipPayer',            header:'送料負担',                 type:'fixed', default:'落札者' },
  { key:'payment',              header:'代金支払い',               type:'fixed', default:'先払い' },
  { key:'yahooEasyPay',         header:'Yahoo!かんたん決済',       type:'fixed', default:'はい' },
  { key:'easyDeal',             header:'かんたん取引',             type:'fixed', default:'はい' },
  { key:'cod',                  header:'商品代引',                 type:'fixed', default:'いいえ' },
  { key:'condition',            header:'商品の状態',               type:'fixed', default:'傷や汚れあり' },

// メーカー表記（"HITACHI 日立" 等）から、カテゴリ分岐に使うブランドキーを判定する
function getBrandKey(manufacturer){
  const m = (manufacturer || '');
  if(/シャープ|SHARP/i.test(m)) return 'シャープ';
  if(/パナソニック|ナショナル|Panasonic|National/i.test(m)) return 'パナソニック、ナショナル';
  if(/日立|HITACHI/i.test(m)) return '日立';
  if(/東芝|TOSHIBA/i.test(m)) return '東芝';
  if(/ダイソン|DYSON/i.test(m)) return 'ダイソン';
  return 'その他';
}

// AIが判定した大分類・種類・ブランドから、確定的にカテゴリIDを1つ選ぶ。
// AIに直接IDを出力させるのではなく、存在するIDの中から必ず選ばせることで誤ったIDの出力を防ぐ。
function resolveCategoryId(applianceType, vacuumType, riceCookerType, brandKey){
  const findByGroup = (group) => CATEGORY_OPTIONS.find(c => c.group===group);
  const findByGroupBrand = (group, brand) => CATEGORY_OPTIONS.find(c => c.group===group && c.brand===brand) || CATEGORY_OPTIONS.find(c => c.group===group && c.brand==='その他');

  if(applianceType === '掃除機'){
    if(vacuumType === 'コードレス') return findByGroup('vacuum-cordless');
    if(vacuumType === 'サイクロン') return findByGroupBrand('vacuum-cyclone', brandKey);
    if(vacuumType === 'スチーム') return findByGroup('vacuum-steam');
    if(vacuumType === 'ロボット') return findByGroup('vacuum-robot');
    if(vacuumType === '一般' || !vacuumType) return findByGroupBrand('vacuum-general', brandKey);
    return findByGroup('vacuum-other');
  }
  if(applianceType === '炊飯器'){
    if(riceCookerType === '圧力IH') return findByGroup('ricecooker-pressure-ih');
    if(riceCookerType === 'IH') return findByGroup('ricecooker-ih');
    if(riceCookerType === 'マイコン') return findByGroup('ricecooker-microcomputer');
    return findByGroup('ricecooker-other');
  }
  return null; // 掃除機・炊飯器のいずれとも判定できない場合は手動選択を促す
}

function getCategoryLabel(id){
  const c = CATEGORY_OPTIONS.find(c=>c.id===id);
  return c ? c.label : '';
}

// カテゴリID(CATEGORY_OPTIONS)から「掃除機／炊飯器／その他」を判定する
function getApplianceKind(product){
  const cat = CATEGORY_OPTIONS.find(c => c.id === product.categoryId);
  if(!cat) return 'other';
  if(cat.group.indexOf('vacuum-') === 0) return 'vacuum';
  if(cat.group.indexOf('ricecooker-') === 0) return 'ricecooker';
  return 'other';
}

function riceCookerTypeLabelFromCategory(categoryId){
  const cat = CATEGORY_OPTIONS.find(c => c.id === categoryId);
  if(cat){
    if(cat.group === 'ricecooker-pressure-ih') return '圧力IH炊飯ジャー 炊飯器';
    if(cat.group === 'ricecooker-ih') return 'IH炊飯ジャー 炊飯器';
    if(cat.group === 'ricecooker-microcomputer') return 'マイコン炊飯ジャー 炊飯器';
  }
  return '炊飯器';
}

// ---- 掃除機専用 ----
function generateVacuumTitle(product){
  const mgmt = formatManagementNumber(product.managementNumber);
  const model = product.info.modelNumber || '';
  const maker = product.info.manufacturer || '';
  const year = product.info.productionYear ? (product.info.productionYear + '年製') : '';
  const makerAndCategory = maker + '電気掃除機'; // メーカー名に直接連結する（メーカー未取得なら「電気掃除機」のみ）
  const parts = [mgmt, model, makerAndCategory, year, '通電確認済み', '中古品'].filter(Boolean);
  return parts.join(' ').replace(/[ \t]{2,}/g, ' ').trim();
}
// 備考行を作る共通処理：
// 未入力の場合は行ごと消す。入力がある場合は「・備考」のラベルは付けず「・入力内容」だけ表示する。
function buildNoteLine(note){
  const trimmed = (note || '').trim();
  if(!trimmed) return '';
  return '・' + trimmed + '<BR>\n<BR>\n';
}

function generateVacuumDescription(product){
  return VACUUM_DESCRIPTION_TEMPLATE
    .split('{{PRODUCT_NAME}}').join(product.title || '')
    .split('{{POWER_CHECK}}').join(product.powerCheck || '〇')
    .split('{{BRUSH_CHECK}}').join(product.brushCheck || '〇')
    .split('{{SUCTION_CHECK}}').join(product.suctionCheck || '〇')
    .split('{{VACUUM_NOTE_LINE}}').join(buildNoteLine(product.vacuumNote));
}

// ---- 炊飯器専用 ----
function generateRiceCookerTitle(product){
  const mgmt = formatManagementNumber(product.managementNumber);
  const model = product.info.modelNumber || '';
  const maker = product.info.manufacturer || '';
  const typeLabel = riceCookerTypeLabelFromCategory(product.categoryId);
  const capacity = (product.riceCookerCapacity && product.riceCookerCapacity !== '合数不明')
    ? ('(' + product.riceCookerCapacity + '炊き)') : '';
  const year = product.info.productionYear ? (product.info.productionYear + '年製') : '';

  // "型番 メーカー" までは半角スペース区切り、"商品タイプ(合数)年製" は詰めて連結する
  const head = [mgmt, model, maker].filter(Boolean).join(' ');
  const tail = typeLabel + capacity + year;
  const parts = [head, tail, '通電確認済み', '中古品'].filter(Boolean);
  return parts.join(' ').replace(/[ \t]{2,}/g, ' ').trim();
}
function generateRiceCookerDescription(product){
  const detail = RICE_COOKER_DETAIL_SECTION
    .split('{{PRODUCT_NAME}}').join(product.title || '')
    .split('{{RICE_NOTE_LINE}}').join(buildNoteLine(product.riceCookerNote));
  const shipping = product.shippingSize === '100サイズ' ? RICE_SHIPPING_SECTION_100 : RICE_SHIPPING_SECTION_140;
  return detail + SHARED_PAYMENT_SECTION + shipping + SHARED_NOTICE_AND_FOOTER;
}

// 合数(例:"5.5合")から箱サイズを自動判定する。判定できない場合はnull。
function capacityToShippingSize(capacityStr){
  if(!capacityStr || capacityStr === '合数不明') return null;
  const num = parseFloat(String(capacityStr).replace(/[^0-9.]/g, ''));
  if(isNaN(num)) return null;
  return num <= 5.5 ? '100サイズ' : '140サイズ';
}

}

const DEVICE_ID_STORAGE_KEY = 'yahoo-csv-tool-device-id';
function getOrCreateDeviceId(){

// 商品データはownerUid（ログイン中のGoogleアカウントのuid）で完全に分離する。
// Firestoreのクエリ自体をuidで絞り込み、さらにセキュリティルール側でも
// 「自分のownerUidのデータしか読み書きできない」よう二重に保護する。
function productsCollection(){ return fbDb.collection('products'); }
function myProductsQuery(){ return productsCollection().where('ownerUid', '==', state.authUser.uid); }
// 管理番号の重複チェックも「自分のデータの中だけ」で行う（ユーザーごとに独立した番号体系にできる）
function mgmtNumbersCollection(){ return fbDb.collection('mgmtNumbers').doc(state.authUser.uid).collection('codes'); }
function settingsDocRef(){ return fbDb.collection('userSettings').doc(state.authUser.uid); }

function sanitizeMgmtKey(code){
  return String(code || '').replace(/[^A-Za-z0-9_-]/g, '_') || '_';
}

// 画像本体(Base64)はFirestoreに保存せず、Firebase Storageへのパス・ダウンロードURLだけを保存する
// （画像そのものは別途Storage上のファイルとして保存されている。uploadImageToCloud参照）。
function stripImagesForSave(images){
  return images.map(img => ({
    id: img.id, isMain: img.isMain,
    storagePath: img.storagePath || null,
    downloadURL: img.downloadURL || null
    // dataUrl はここに含めない（サイズが大きいため）
  }));
}

// Firestoreドキュメント(商品1件分)をアプリ内で扱う商品オブジェクトへ変換する
function firestoreDocToProduct(doc){
  const data = doc.data() || {};
  const resolvedCode = data.managementNumber ? getFullManagementNumber(data.managementNumber) : '';
  return Object.assign({}, data, { id: doc.id, _reservedMgmtCode: resolvedCode });
}

// 商品作成は即座にクラウドへ書き込む（デバウンスしない）。他端末にすぐ見えるようにするため。
async function createProductInCloud(product){
  if(state.authState !== 'ready') return;
  lastLocalEditAt[product.id] = Date.now();
  try{
    const payload = Object.assign({}, product, { images: stripImagesForSave(product.images) });
    delete payload._reservedMgmtCode;
    await productsCollection().doc(product.id).set(payload);
  }catch(e){
    console.error('商品の作成に失敗しました', e);

}

async function deleteProductFromCloud(product){
  if(state.authState !== 'ready') return;
  try{
    await productsCollection().doc(product.id).delete();
    const code = product.managementNumber ? getFullManagementNumber(product.managementNumber) : '';
    if(code){
      await mgmtNumbersCollection().doc(sanitizeMgmtKey(code)).delete().catch(()=>{});
    }

let saveTimers = {}; // 商品ID -> タイマー（商品ごとに個別にデバウンス保存する）
let lastLocalEditAt = {}; // 商品ID -> このタブで最後にローカル編集した時刻（他端末の更新との衝突判定に使う）
function scheduleSaveProduct(productId){
  lastLocalEditAt[productId] = Date.now();
  clearTimeout(saveTimers[productId]);
  saveTimers[productId] = setTimeout(() => persistProduct(productId), 700);
}

// 管理番号の重複を防ぐため、Firestore Transactionで排他制御しつつ商品を保存する
// （自分のデータの中だけでの重複チェック。ユーザーが異なれば同じ番号を使ってもよい）。
// 同じ管理番号が既に「別の商品」で使われていた場合は保存を中止し、警告を表示する
// （複数端末が同時に同じ番号を登録しようとしても、どちらか一方だけが成功する）。
async function persistProduct(productId){
  if(state.authState !== 'ready') return;
  const product = getProduct(productId);
  if(!product) return;

  const normalizedCode = product.managementNumber ? getFullManagementNumber(product.managementNumber) : '';
  const prevReserved = product._reservedMgmtCode || '';

  if(normalizedCode !== prevReserved){
    try{
      await fbDb.runTransaction(async (tx) => {
        if(normalizedCode){
          const newRef = mgmtNumbersCollection().doc(sanitizeMgmtKey(normalizedCode));
          const newSnap = await tx.get(newRef);
          if(newSnap.exists && newSnap.data().productId !== productId){
            throw new Error('DUPLICATE_MGMT_NUMBER');
          }
        }
        if(prevReserved && prevReserved !== normalizedCode){
          tx.delete(mgmtNumbersCollection().doc(sanitizeMgmtKey(prevReserved)));
        }
        if(normalizedCode){
          tx.set(mgmtNumbersCollection().doc(sanitizeMgmtKey(normalizedCode)), { productId });
        }
      });
      product._reservedMgmtCode = normalizedCode;
    }catch(e){
      if(String(e.message).includes('DUPLICATE_MGMT_NUMBER')){
        showToast('管理番号 ' + normalizedCode + ' はすでに登録されています。別の番号にしてください');
      }else{
        console.error(e);
        showToast('管理番号の確認に失敗しました: ' + e.message);
      }
      return; // 重複時・エラー時は保存を中止（商品データそのものは書き込まない）
    }
  }

  product.updatedAt = Date.now();
  try{
    const payload = Object.assign({}, product, { images: stripImagesForSave(product.images) });
    delete payload._reservedMgmtCode;
    await productsCollection().doc(productId).set(payload);
  }catch(e){
    console.error('保存に失敗しました', e);
    showToast('クラウドへの保存に失敗しました: ' + e.message);
  }
}

// ============ 商品：リアルタイム同期 ============

// 自分（ログイン中のuid）が所有する商品だけをリアルタイム購読する。
// クエリ自体をownerUidで絞り込んでいるため、他のユーザーの商品データはそもそも
// 一切取得されない（表示上隠すのではなく、データが来ない）。
// ・商品は1つずつ独立したFirestoreドキュメントなので、自分の他端末での変更は該当商品にだけ反映される
// ・ただし「今まさに選択して編集中の商品」だけは、他端末発の更新で上書きしない
//   （編集中のフォームが、他の変更をきっかけに再生成されて入力内容が消えるのを防ぐ）
function subscribeToProducts(){
  myProductsQuery().onSnapshot((snapshot) => {
    let changed = false;
    snapshot.docChanges().forEach((change) => {
      const id = change.doc.id;
      if(change.type === 'removed'){
        if(state.products.some(p => p.id === id)){
          state.products = state.products.filter(p => p.id !== id);
          state.selectedForExport.delete(id);
          if(state.selectedProductId === id){
            state.selectedProductId = state.products.length ? state.products[0].id : null;
          }
          changed = true;
        }
        return;
      }
      // added または modified
      const idx = state.products.findIndex(p => p.id === id);
      if(id === state.selectedProductId && idx >= 0){
        const editedAgoMs = Date.now() - (lastLocalEditAt[id] || 0);
        if(editedAgoMs < 4000){
          return; // 直近数秒以内にこの端末で編集した場合のみ、他端末の更新で上書きしない
        }
      }
      const data = firestoreDocToProduct(change.doc);
      if(idx >= 0) state.products[idx] = data;
      else state.products.push(data);
      changed = true;
    });
    if(!state.selectedProductId && state.products.length){
      state.selectedProductId = state.products[0].id;
      changed = true;
    }
    state.loaded = true;
    if(changed) render();
  }, (err) => {
    console.error('商品のリアルタイム同期でエラーが発生しました', err);
  });
}

// ============ 画像：Supabase Storageへの保存・削除・取得 ============

// 画像はユーザーのuidごとにパスを分けて保存する（products/{uid}/{productId}/images/...）。
// これにより実務上、他ユーザーの画像と混ざることはない。
// 【重要】ただしSupabase側は現在「共通の公開鍵」でアクセスする設定のため、Firestoreほど
// 厳密な保護（アクセス自体を拒否する）にはなっていない。実務上は十分だが、より厳密な
// 保護が必要な場合はSupabase側でFirebase認証と連携する追加設定が必要になる。
async function uploadImageToCloud(product, img){
  if(!sbClient || state.authState !== 'ready') return;
  try{
    const path = 'products/' + state.authUser.uid + '/' + product.id + '/images/' + img.id + '.jpg';
    const bytes = dataUrlToUint8Array(img.dataUrl);
    const { error } = await sbClient.storage.from(SUPABASE_CONFIG.bucket).upload(path, bytes, {
      contentType: 'image/jpeg', upsert: true
    });
    if(error) throw error;
    const { data } = sbClient.storage.from(SUPABASE_CONFIG.bucket).getPublicUrl(path);
    img.storagePath = path;
    img.downloadURL = data.publicUrl;
    scheduleSaveProduct(product.id);
  }catch(e){
    console.error('画像のクラウド保存に失敗しました', e);
  }
}

async function deleteImageFromCloud(img){
  if(!sbClient || !img.storagePath) return;
  try{
    const { error } = await sbClient.storage.from(SUPABASE_CONFIG.bucket).remove([img.storagePath]);
    if(error) throw error;
  }catch(e){ console.error('クラウド画像の削除に失敗しました（無視して続行）', e); }
}

// 画像のBase64データが必要な処理（AI解析・CSV埋め込み・ZIP作成など）の直前に呼ぶ。
// ローカルにdataUrlが既にあればそれを使い、無ければStorageのdownloadURLから取得してキャッシュする。
async function getImageDataUrl(img){
  if(img.dataUrl) return img.dataUrl;
  if(!img.downloadURL) return null;
  try{
    const res = await fetch(img.downloadURL);
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    img.dataUrl = dataUrl; // このセッション中はキャッシュして使い回す
    return dataUrl;
  }catch(e){
    console.error('画像の取得に失敗しました', e);
    return null;
  }
}

/* ---------- 4. UTILITIES ---------- */

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('読み込みに失敗しました'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像の解析に失敗しました'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height*(maxDim/width)); width = maxDim; }
          else{ width = Math.round(width*(maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// CSVエスケープ。ダブルクォート・カンマ・改行を含む値は正しく引用符で囲む（RFC4180準拠）。
function csvEscape(value){
  const s = (value===undefined || value===null) ? '' : String(value);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function getProduct(id){ return state.products.find(p=>p.id===id); }
function selectedProduct(){ return state.selectedProductId ? getProduct(state.selectedProductId) : null; }

// ユーザーは管理番号の「数字部分」だけを入力する（例："6273"）。
// プレフィックス（既定 "OR-"）は自動的に付与し、"OR-6273" を組み立てる。
// 万一ユーザーがプレフィックスまで含めて入力してしまった場合や、括弧付きで入力した場合も
// 二重にならないよう吸収する。
function getFullManagementNumber(raw){
  if(!raw) return '';
  let s = String(raw).trim();
  s = s.replace(/^\(+/, '').replace(/\)+$/, '').trim();
  if(!s) return '';
  const prefix = state.settings.managementNumberPrefix || '';
  if(prefix && s.toUpperCase().startsWith(prefix.toUpperCase())){
    s = s.slice(prefix.length);
  }
  return prefix + s;
}

// "(OR-6273)" の形式（商品名・説明文への挿入用）
function formatManagementNumber(raw){
  const full = getFullManagementNumber(raw);
  if(!full) return '';
  return '(' + full + ')';
}

function computeErrors(product){
  const errors = [];
  const warnings = [];
  if(!product.images.length) warnings.push('商品画像が未登録です');
  if(!product.managementNumber || !product.managementNumber.trim()) warnings.push('商品管理番号が未入力です');
  if(!product.info.modelNumber || !product.info.modelNumber.trim()) errors.push('型番を認識できませんでした（手入力してください）');
  if(!product.info.manufacturer || !product.info.manufacturer.trim()) errors.push('メーカーを認識できませんでした（手入力してください）');
  if(!product.info.productionYear || !product.info.productionYear.trim()) warnings.push('製造年が不明です（画像から確認できなかったため、必要であれば手入力してください）');
  if(!product.categoryId) errors.push('商品カテゴリを判定できませんでした（手動で選択してください）');
  else if(product.categoryConfidence !== null && product.categoryConfidence !== undefined && product.categoryConfidence < 70) warnings.push('カテゴリ判定の確信度が低めです（' + product.categoryConfidence + '%）。ご確認ください');
  if(product.aiStatus === 'error') warnings.push('AI解析でエラーが発生しました。手動で型番・メーカー・製造年を入力してください');
  if(product.aiMultiWarning) warnings.push('画像内に複数の商品が写っている可能性があります。型番・メーカーをご確認ください');
  ['modelNumber','manufacturer','productionYear'].forEach(k=>{
    const c = product.confidence[k];
    if(product.info[k] && c!==null && c!==undefined && c < 70){
      warnings.push((k==='modelNumber'?'型番':k==='manufacturer'?'メーカー':'製造年') + 'の判定に自信がありません（信頼度' + c + '%）。ご確認ください');
    }
  });
  if(!product.title || !product.title.trim()) errors.push('商品名が空欄です');
  if(!product.description || !product.description.includes(product.title || '\u0000')) warnings.push('商品説明の先頭が現在の商品名と一致していない可能性があります。「テンプレートから再生成」で同期してください');
  return { errors, warnings };
}

// 画像埋め込み込みのCSV推定サイズ（Base64文字列のバイト概算）
function estimateEmbeddedImageBytes(){
  if(!state.settings.includeImagesInCsv) return 0;
  let total = 0;
  state.products.forEach(p=>{
    p.images.slice(0, state.settings.csvImageCount).forEach(img=>{ total += (img.dataUrl ? img.dataUrl.length : 0); });
  });
  return total;
}
function formatBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

function showToast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 2800);
}
function escapeHtml(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function confidenceBadge(c){
  if(c===null || c===undefined) return '';
  let cls = 'high';
  if(c < 70) cls='low'; else if(c < 90) cls='mid';
  return `<span class="confidence ${cls}">信頼度 ${c}%</span>`;
}

/* ---------- 5. AI 認識 ---------- */

const AI_SYSTEM_PROMPT =
`あなたは中古家電をヤフオクへ大量出品する事業者向けの、熟練した商品画像解析アシスタントです。
アップロードされた商品写真（本体全体・銘板/型番シールの接写・付属品・背面/底面など、複数アングル）を
すべて丁寧に見比べて解析してください。1枚だけでなく、全ての画像を突き合わせて矛盾がないか確認すること。

この解析には性質の異なる2種類の作業が含まれます。取り違えないこと。

■ 作業A：文字の読み取り（型番・メーカー・製造年）— 絶対に推測しない
本体の銘板・ラベル・シールに印字された文字を正確に読み取る。読めない場合は空文字列にする。
- modelNumber: 型番。銘板の型番表記をそのまま採用する。かすれ・反射・斜め撮影で一部が判読できない場合、
  読み取れた範囲だけを採用するか、判読不能なら空文字列にする。似た型番（例:CV-F50とCV-F55）を
  勝手にどちらかに決めない。
- manufacturer: メーカー名。"ENGLISH表記 日本語表記" の形式で出力する。
  例: "HITACHI 日立" "TOSHIBA 東芝" "Panasonic パナソニック" "SONY ソニー" "SHARP シャープ" "MITSUBISHI 三菱" "DYSON ダイソン" "TIGER タイガー" "ZOJIRUSHI 象印"。
  銘板の文字だけでなく、本体・ロゴのデザイン（例: ダイソンの独特なサイクロン形状とマゼンタ/紫の配色、
  パナソニックの青いロゴ、SHARPの赤いロゴ、日立の赤いロゴ、東芝の青いロゴ）も判断材料にしてよいが、
  文字が確認できない場合はロゴ・デザインのみでの断定は避け、確信が持てなければ空文字列にする。
  日本語表記は「タイガー魔法瓶」「日立製作所」のような正式な法人名ではなく、一般消費者に広く知られている
  分かりやすいブランド名（通称）を使うこと（例: タイガー魔法瓶(株) → タイガー、日立製作所 → 日立、
  象印マホービン(株) → 象印）。
- productionYear: 製造年（西暦4桁）。「2019年製」「19年製」のような記載がある場合のみ抽出し、
  2桁表記は妥当な西暦に変換する。記載が見当たらない場合は絶対に推測せず空文字列にする。

■ 作業B：見た目からの分類（商品種別・掃除機のタイプ）— 視覚的な推論は許可される
文字が読めなくても、本体の形状・構造から合理的に分類してよい。ただし確信度を正直に申告すること。
- applianceType: "掃除機" | "炊飯器" | ""（どちらでもない、または判断できない場合は空文字列）
- vacuumType（applianceTypeが"掃除機"の場合のみ）:
  "一般"（コード付きの通常の紙パック/サイクロン式アップライト・キャニスター型で下記のどれにも該当しない標準的なもの）
  "コードレス"（電源コードがなく、バッテリーパック内蔵のスティック型・ハンディ型）
  "サイクロン"（透明または半透明のダストカップが見え、紙パックを使わないサイクロン分離構造が主要な特徴として分かるもの）
  "スチーム"（モップパッド・スチーム噴射穴・床拭き用のフラットヘッドがあるもの）
  "ロボット"（円盤型・自走式のロボット掃除機）
  ""（掃除機と分かるが種類を判断できない場合）
  ※ コードレスとサイクロンの両方の特徴がある場合は、より特徴的な構造を優先する
    （透明ダストカップが目立つならサイクロン、そうでなければコードレスを優先）。
- riceCookerType（applianceTypeが"炊飯器"の場合のみ）:
  "圧力IH"（蓋に圧力弁・圧力表示があるもの、または「圧力IH」の記載があるもの）
  "IH"（「IH」の表記があり圧力機構が見当たらないもの）
  "マイコン"（「マイコン」の記載がある、またはシンプルな廉価モデルの外観）
  ""（炊飯器と分かるが種類を判断できない場合）
- categoryReasoning: 上記の分類をどう判断したか、1〜2文で簡潔に（視覚的な根拠を書く）。
- categoryConfidence: 0〜100の整数。分類の確信度。

■ 作業C：炊飯器の炊飯容量（合数）の推定（applianceTypeが"炊飯器"の場合のみ）
- riceCookerCapacity: 炊飯容量（例:"5.5合"、"3合"、"10合"）。
  型番の一部の数字だけを見て単純に「合数」と決めつけないこと（例: 型番中の "10" を安易に10合と判断しない）。
  型番の製品シリーズ・メーカー・本体の大きさ・パッケージや表示ラベルなど、画像から得られる情報を
  総合的に判断すること。確信が持てない場合は空文字列にする（無理に数値を作らない）。

各項目（型番・メーカー・製造年）について confidence（0〜100の整数、確信度）も返すこと。
値が空文字列の場合、confidenceは0とする。

厳守事項:
- 作業Aの3項目（型番・メーカー・製造年）は、画像から明確に読み取れない情報を絶対に推測や創作しない。
- 型番の候補が複数考えられる、ラベルの一部が不鮮明、などで判定に自信が持てない場合は、
  値を空文字列にするか、低いconfidence値を設定したうえで notes に理由を日本語で簡潔に記載する
  （例:"型番の判定に自信がありません。ラベルの一部が不鮮明です。"）。
- 作業Bの分類は視覚的推論を歓迎するが、判断できない場合は無理に決めず空文字列にする。
- 作業Cの合数推定も、型番の数字だけからの機械的な決めつけは禁止。確信が持てなければ空文字列にする。
- 1枚の画像に複数の異なる商品が写っていて対象が判別しづらい場合は multipleProductsWarning を true にする。
- 複数の画像間で型番やメーカーの見え方に矛盾がある場合は notes にその旨を記載する。
- 出力は次のJSON形式のみ。前置き・説明・コードブロック記号（\`\`\`）は一切付けない。

{"modelNumber":"","modelNumberConfidence":0,"manufacturer":"","manufacturerConfidence":0,"productionYear":"","productionYearConfidence":0,"applianceType":"","vacuumType":"","riceCookerType":"","riceCookerCapacity":"","categoryReasoning":"","categoryConfidence":0,"notes":"","multipleProductsWarning":false}`;

// AI解析エンジン：Google Gemini API（画像対応モデル）を使用する。
// モデル名はここ1箇所だけで管理する（将来のモデル変更時はここだけ書き換えればよい）。
const GEMINI_MODEL = 'gemini-3.5-flash';

// 高速化パラメータ
const AI_CONCURRENCY = 5;          // 一括解析の同時実行数（Worker Pool方式。無制限のPromise.allは行わない）
const AI_MAX_IMAGES_SINGLE = 10;   // 単品解析：精度優先で最大10枚
const AI_MAX_IMAGES_BATCH = 5;     // 一括解析：速度優先で最大5枚（商品の画像が5枚以下ならその枚数のまま）
const AI_MAX_RETRIES = 3;          // 429/5xx/タイムアウト/ネットワークエラー時の最大リトライ回数
const AI_TIMEOUT_MS = 60000;       // 1リクエストあたりのタイムアウト
const AI_MAX_OUTPUT_TOKENS = 4096; // gemini-3.5-flashは思考(thinking)にも出力トークン枠を使うため、
                                    // JSON本体が途中で切れないよう余裕を持たせた値にしている

// このツールを外部サイト（GitHub Pages等）で公開して使う場合、Gemini APIへは
// ユーザー自身のAPIキーが必要（ブラウザから直接呼び出す構成のため）。
function hasGeminiApiKey(){
  return !!(state.settings.geminiApiKey && state.settings.geminiApiKey.trim());
}

function geminiEndpoint(){
  const key = encodeURIComponent(state.settings.geminiApiKey.trim());
  return `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;
}

// Gemini APIのHTTPエラーを、原因が分かりやすい日本語メッセージに変換する
async function describeGeminiError(response){
  let bodyText = '';
  try{ bodyText = await response.text(); }catch(e){ /* 無視 */ }
  let apiMessage = '';
  try{
    const parsed = JSON.parse(bodyText);
    apiMessage = (parsed.error && parsed.error.message) ? parsed.error.message : '';
  }catch(e){ /* JSONでない場合はそのまま */ }

  if(response.status === 400) return 'リクエスト内容に問題があります（400）。' + (apiMessage || 'APIキーの形式や画像データを確認してください。');
  if(response.status === 401 || response.status === 403) return 'APIキーが正しくないか、権限がありません（' + response.status + '）。設定 → AI設定でキーを確認してください。' + (apiMessage ? ' 詳細: ' + apiMessage : '');
  if(response.status === 429) return 'Gemini APIの利用制限に達した可能性があります（429）。少し時間を置いてから再実行してください。';
  if(response.status >= 500) return 'Gemini API側で一時的な問題が発生しています（' + response.status + '）。しばらくしてから再実行してください。';
  return 'Gemini APIエラー（' + response.status + '）' + (apiMessage ? ': ' + apiMessage : '');
}

// GeminiのレスポンスからJSON部分だけを安全に抽出する（前後に説明文が付いた場合や
// ```json ... ``` で囲まれた場合にも対応する）
function extractJsonFromText(text){
  let raw = (text || '').trim();
  raw = raw.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
  try{
    return JSON.parse(raw);
  }catch(e){
    const m = raw.match(/\{[\s\S]*\}/);
    if(m){
      try{ return JSON.parse(m[0]); }catch(e2){ /* 失敗 */ }
    }
  }
  throw new Error('AIの応答をJSONとして解釈できませんでした');
}

function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Gemini APIへリクエストを送信する。一時的なエラー（429/5xx/タイムアウト/ネットワークエラー）は
// 指数バックオフ（1秒→2秒→4秒）で最大 AI_MAX_RETRIES 回リトライする。
// 400/401/403（設定・入力の問題である可能性が高い）はリトライしない。
// AbortControllerでリクエストごとにタイムアウト（AI_TIMEOUT_MS）を設定する。
async function fetchGeminiWithRetry(body){
  for(let attempt = 0; attempt <= AI_MAX_RETRIES; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
    let response = null, networkError = null;
    try{
      response = await fetch(geminiEndpoint(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: controller.signal
      });
    }catch(e){
      networkError = e;
    }finally{
      clearTimeout(timer);
    }

    if(response && response.ok) return response;

    let canRetry = false;
    let errorMessage = '';
    if(response){
      canRetry = [429,500,502,503,504].includes(response.status);
      errorMessage = await describeGeminiError(response);
    }else if(networkError){
      canRetry = true; // タイムアウト・ネットワークエラーはリトライ対象
      errorMessage = (networkError.name === 'AbortError')
        ? 'Gemini APIへのリクエストがタイムアウトしました（60秒）'
        : ('ネットワークエラー: ' + networkError.message);
    }

    if(!canRetry || attempt === AI_MAX_RETRIES){
      throw new Error(errorMessage);
    }
    await sleep(Math.pow(2, attempt) * 1000); // 1秒 → 2秒 → 4秒
  }
}

// 画像（複数枚）とプロンプトをGeminiへ送信し、解析結果のJSONを返す共通処理。
// AIはこの認識処理だけを担当し、CSVやHTML・商品名の生成には一切関与しない。
async function callGeminiVisionJson(promptText, images){
  // 画像取得（Storageからの取得が必要なものも含む）を並列化する。1枚ずつ待たない。
  const durls = await Promise.all(images.map(img => getImageDataUrl(img)));

  const parts = [{ text: promptText }];
  durls.forEach(durl => {
    if(!durl) return;
    const match = /^data:(image\/[a-zA-Z]+);base64,(.*)$/.exec(durl);
    if(match) parts.push({ inline_data: { mime_type: match[1], data: match[2] } });
  });

  const response = await fetchGeminiWithRetry({
    systemInstruction: { parts: [{ text: AI_SYSTEM_PROMPT }] },
    contents: [{ role: 'user', parts }],
    generationConfig: {
      responseMimeType: 'application/json',
      temperature: 0,               // OCR・分類タスクのため安定性を優先
      maxOutputTokens: AI_MAX_OUTPUT_TOKENS,
      // gemini-3.5-flashは思考(thinking)を完全にはオフにできない仕様のため、
      // 最も軽い設定にして思考によるトークン消費・遅延を最小限に抑える
      thinkingConfig: { thinkingLevel: 'low' }
    }
  });

  const data = await response.json();
  const candidate = (data.candidates || [])[0];
  const blockReason = data.promptFeedback && data.promptFeedback.blockReason;
  if(blockReason){
    throw new Error('Geminiにより内容がブロックされました（' + blockReason + '）。画像の内容をご確認ください。');
  }
  const finishReason = candidate && candidate.finishReason;
  const textPart = candidate && candidate.content && (candidate.content.parts || []).find(p => typeof p.text === 'string');
  if(!textPart){
    throw new Error('AIからの応答が空でした' + (finishReason ? '（finishReason: ' + finishReason + '）' : ''));
  }
  try{
    return extractJsonFromText(textPart.text);
  }catch(e){
    // 診断しやすいよう、実際に返ってきた内容の先頭部分とfinishReasonをエラーに含める
    const snippet = textPart.text.slice(0, 300).replace(/\s+/g, ' ');
    throw new Error(
      'AIの応答をJSONとして解釈できませんでした' +
      (finishReason ? '（finishReason: ' + finishReason + '）' : '') +
      ' / 応答内容の先頭: ' + snippet
    );
  }
}

// options.maxImages: 送信する画像の最大枚数（単品解析=10枚, 一括解析=5枚）
// options.silent: trueの場合、この関数内ではrender()を呼ばない（一括解析側でまとめて間引いて描画するため）
async function runAiAnalysis(product, options){
  options = options || {};
  const maxImages = options.maxImages || AI_MAX_IMAGES_SINGLE;
  const silent = !!options.silent;

  if(!product.images.length){
    if(!silent) showToast('画像をアップロードしてから解析してください');
    return false;
  }
  if(!hasGeminiApiKey()){
    if(!silent) showToast('AI解析にはGoogle Gemini APIキーの設定が必要です（設定 → AI設定）');
    return false;
  }
  if(product.aiStatus === 'loading'){
    return false; // 二重解析を防止（一括解析中に個別ボタンが押された場合など）
  }
  product.aiStatus = 'loading';
  product.aiError = '';
  if(!silent) render();
  try{
    const imagesToSend = product.images.slice(0, maxImages);
    const parsed = await callGeminiVisionJson(
      'これらは同一商品の写真です（本体・銘板の接写・別アングルなどを含みます）。すべての画像を突き合わせて確認し、型番・メーカー・製造年の文字情報と、商品カテゴリ（掃除機か炊飯器か、その種類）の視覚的な分類の両方を行ってください。',
      imagesToSend
    );

    product.info.modelNumber = parsed.modelNumber || '';
    product.info.manufacturer = parsed.manufacturer || '';
    product.info.productionYear = parsed.productionYear || '';
    product.confidence.modelNumber = typeof parsed.modelNumberConfidence === 'number' ? parsed.modelNumberConfidence : null;
    product.confidence.manufacturer = typeof parsed.manufacturerConfidence === 'number' ? parsed.manufacturerConfidence : null;
    product.confidence.productionYear = typeof parsed.productionYearConfidence === 'number' ? parsed.productionYearConfidence : null;
    product.aiNotes = parsed.notes || '';
    product.aiMultiWarning = !!parsed.multipleProductsWarning;
    product.aiStatus = 'done';

    const brandKey = getBrandKey(product.info.manufacturer);
    const matched = resolveCategoryId(parsed.applianceType || '', parsed.vacuumType || '', parsed.riceCookerType || '', brandKey);
    product.categoryId = matched ? matched.id : '';
    product.categoryConfidence = typeof parsed.categoryConfidence === 'number' ? parsed.categoryConfidence : null;
    product.categoryReasoning = parsed.categoryReasoning || '';

    // 炊飯器の合数（AIが判定できた場合のみ反映。型番の数字だけからの機械的判定はプロンプト側で禁止している）
    if(parsed.applianceType === '炊飯器'){
      product.riceCookerCapacity = parsed.riceCookerCapacity || '合数不明';
      if(!product.shippingSizeManual){
        const autoSize = capacityToShippingSize(product.riceCookerCapacity);
        if(autoSize) product.shippingSize = autoSize;
      }
    }

    regenerateAll(product);
    scheduleSaveProduct(product.id);
    return true;
  }catch(e){
    console.error(e);
    product.aiStatus = 'error';
    product.aiError = 'Gemini AI解析に失敗しました。手動で型番・メーカー・製造年を入力してください（' + e.message + '）';
    return false;
  }finally{
    if(!silent) render();
  }

}

/* ---------- 6. 商品名生成 / 説明文プレースホルダー置換エンジン ---------- */

// 「その他」カテゴリー用（従来ロジック。掃除機・炊飯器以外はこれをそのまま使う）
function generateGenericTitle(product){
  const vars = {
    MANAGEMENT_NUMBER: formatManagementNumber(product.managementNumber),
    MODEL_NUMBER: product.info.modelNumber || '',
    MANUFACTURER: product.info.manufacturer || '',
    PRODUCTION_YEAR: product.info.productionYear || ''
  };
  let t = state.settings.titleTemplate.replace(/\{\{(.*?)\}\}/g, (m,name) => vars[name.trim()] !== undefined ? vars[name.trim()] : '');
  t = t.replace(/[ \t]{2,}/g, ' ').trim();
  return t;
}
// 固定HTMLテンプレートの中の「貼り付け！」だけを商品名へ置換する。他は一切変更しない。
function renderGenericDescription(product){
  return DESCRIPTION_TEMPLATE.split(PLACEHOLDER_TEXT).join(product.title || '');
}

// 商品名生成のディスパッチャー。カテゴリー（掃除機／炊飯器／その他）で処理を振り分ける。
// 将来カテゴリーを追加する場合は、ここに分岐を追加していけばよい。
function generateTitle(product){
  const kind = getApplianceKind(product);
  if(kind === 'vacuum') return generateVacuumTitle(product);
  if(kind === 'ricecooker') return generateRiceCookerTitle(product);
  return generateGenericTitle(product);
}

// 商品説明生成のディスパッチャー。
function renderDescription(product){
  const kind = getApplianceKind(product);
  if(kind === 'vacuum') return generateVacuumDescription(product);
  if(kind === 'ricecooker') return generateRiceCookerDescription(product);
  return renderGenericDescription(product);
}

function regenerateAll(product){
  product.title = generateTitle(product);
  product.description = renderDescription(product);
}

/* ---------- 7. CSV 生成エンジン ---------- */

function getCsvValue(product, col){
  if(col.type === 'title') return product.title || '';
  if(col.type === 'description') return product.description || '';
  if(col.type === 'category') return product.categoryId || '';
  if(col.type === 'image'){
    const img = product.images[col.index];
    return img ? img.dataUrl : '';
  }
  // 固定値。JSの数値変換等を経由させず、常に文字列としてそのまま保持する。
  return state.settings.fixedValues[col.key] !== undefined ? String(state.settings.fixedValues[col.key]) : '';
}

// 画像を含めるか・何枚まで含めるかの設定を反映した、実際に出力される列一覧
function getActiveCsvColumns(){
  return CSV_COLUMNS.filter(c=>{
    if(c.type !== 'image') return true;
    if(!state.settings.includeImagesInCsv) return false;
    return c.index < state.settings.csvImageCount;
  });
}

function buildCsvText(){
  const cols = getActiveCsvColumns();
  const header = cols.map(c=>csvEscape(c.header)).join(',');
  const rows = state.products.map(p => cols.map(c=>csvEscape(getCsvValue(p,c))).join(','));
  return [header].concat(rows).join('\r\n');
}

function downloadCsv(){
  const text = buildCsvText();
  const charset = state.settings.csvCharset;
  let blob;
  try{
    if(charset==='sjis'){
      if(typeof Encoding==='undefined' || window.__sjisUnavailable){
        showToast('Shift-JIS変換ライブラリを利用できません。UTF-8 BOMで出力します');
        blob = new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' });
      }else{
        const unicodeArray = Encoding.stringToCode(text);
        const sjisArray = Encoding.convert(unicodeArray, { to:'SJIS', from:'UNICODE' });
        blob = new Blob([new Uint8Array(sjisArray)], { type:'text/csv' });
      }
    }else if(charset==='utf8bom'){
      blob = new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' });
    }else{
      blob = new Blob([text], { type:'text/csv;charset=utf-8' });
    }
  }catch(e){
    console.error(e);
    showToast('CSV生成でエラーが発生しました');
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  a.href = url; a.download = 'auction-listing-data_' + stamp + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  showToast('CSVをダウンロードしました');
}

// 商品ごとにアップロードした画像を「商品番号名のフォルダ」に振り分けたZIPを作る。
// これは Windows版一括ツールの「サブフォルダ方式」（フォルダ名=商品番号、中の画像名は自由）
// にそのまま読み込める構造なので、写真をリネームする必要がない。
function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function extForDataUrl(dataUrl){
  const m = /^data:image\/([a-zA-Z0-9]+);/.exec(dataUrl);
  if(!m) return 'jpg';
  const t = m[1].toLowerCase();
  if(t === 'jpeg') return 'jpg';
  return t;
}

async function downloadImageFolderZip(){
  if(typeof JSZip === 'undefined' || window.__jszipUnavailable){
    showToast('ZIP作成ライブラリを読み込めませんでした。通信環境を確認してください');
    return;
  }
  const withImages = state.products.filter(p => p.images.length > 0);
  const skipped = state.products.filter(p => p.images.length > 0 && !getFullManagementNumber(p.managementNumber));

  if(!withImages.length){
    showToast('画像が登録されている商品がありません');
    return;
  }

  showToast('画像フォルダZIPを作成しています…');
  const zip = new JSZip();
  const usedFolderNames = new Set();

  for(const p of withImages){
    const code = getFullManagementNumber(p.managementNumber);
    let folderName = code || ('unassigned_' + p.id);
    // 万一同じ管理番号の商品が複数あった場合に上書きされないよう連番を振る
    let finalName = folderName, n = 1;
    while(usedFolderNames.has(finalName)){ finalName = folderName + '_' + (++n); }
    usedFolderNames.add(finalName);

    const folder = zip.folder(finalName);
    for(let idx=0; idx<p.images.length; idx++){
      const img = p.images[idx];
      const durl = await getImageDataUrl(img);
      if(!durl) continue;
      const ext = extForDataUrl(durl);
      const fname = String(idx + 1).padStart(2, '0') + '.' + ext;
      folder.file(fname, dataUrlToUint8Array(durl));
    }
  }

  try{
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
    a.href = url; a.download = 'product-images_' + stamp + '.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    if(skipped.length){
      showToast('画像フォルダZIPをダウンロードしました（管理番号未入力の' + skipped.length + '件は "unassigned_" フォルダに入っています）');
    }else{
      showToast('画像フォルダZIPをダウンロードしました');
    }
  }catch(e){
    console.error(e);
    showToast('画像フォルダZIPの作成に失敗しました');
  }
}

// File System Access API（Chrome/Edge等）が使えるブラウザでは、ZIPを経由せず
// ユーザーが選んだフォルダへ「商品番号ごとのサブフォルダ＋画像」を直接書き出せる。
// 展開の手間がなく、フォルダを選ぶだけで完了する。
function supportsDirectFolderSave(){
  return typeof window.showDirectoryPicker === 'function';
}

function sanitizeFolderNameForFs(name){
  return String(name).replace(/[\\/:*?"<>|]/g, '_').trim() || 'unnamed';
}

async function saveImageFolderDirect(){
  if(!supportsDirectFolderSave()){
    showToast('お使いのブラウザは直接保存に対応していません（Chrome / Edgeでお試しください）。ZIPダウンロードをご利用ください');
    return;
  }
  const withImages = state.products.filter(p => p.images.length > 0);
  if(!withImages.length){
    showToast('画像が登録されている商品がありません');
    return;
  }

  let rootHandle;
  try{
    rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  }catch(e){
    return; // ユーザーがキャンセルした場合など
  }

  showToast('選択したフォルダに保存しています…');
  const usedFolderNames = new Set();
  let savedCount = 0;
  const skipped = withImages.filter(p => !getFullManagementNumber(p.managementNumber));

  try{
    for(const p of withImages){
      const code = getFullManagementNumber(p.managementNumber);
      let folderName = sanitizeFolderNameForFs(code || ('unassigned_' + p.id));
      let finalName = folderName, n = 1;
      while(usedFolderNames.has(finalName)){ finalName = folderName + '_' + (++n); }
      usedFolderNames.add(finalName);

      const dirHandle = await rootHandle.getDirectoryHandle(finalName, { create: true });
      for(let idx = 0; idx < p.images.length; idx++){
        const img = p.images[idx];
        const durl = await getImageDataUrl(img);
        if(!durl) continue;
        const ext = extForDataUrl(durl);
        const fname = String(idx + 1).padStart(2, '0') + '.' + ext;
        const fileHandle = await dirHandle.getFileHandle(fname, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(dataUrlToUint8Array(durl));
        await writable.close();
      }
      savedCount++;
    }
    showToast('フォルダへの保存が完了しました（' + savedCount + '商品分' + (skipped.length ? '、管理番号未入力の' + skipped.length + '件は "unassigned_" フォルダ' : '') + '）');
  }catch(e){
    console.error(e);
    showToast('フォルダへの保存中にエラーが発生しました: ' + e.message);
  }
}

/* ---------- 8b. オークタウン用ZIP（CSV＋画像を1つのZIPにまとめて、そのままアップロードできる形） ---------- */

// 商品ごとに、ZIPへ格納する際の実際の画像ファイル名（半角英数字のみ）を決める。
// この名前をCSVの画像1〜10列にもそのまま使うことで、ZIP内の実ファイルとCSVの記載が
// 必ず一致するようにする（Windows版一括ツールで発生した「ファイルが存在しません」問題と
// 同じ種類の不整合を防ぐため、最初から同じ情報源から両方を組み立てる）。
async function computeZipImageFilenames(products){
  const map = {};
  const usedNames = new Set();
  const maxSlots = CSV_COLUMNS.filter(c => c.type === 'image').length; // 通常10
  for(const p of products){
    if(!p.images.length){ map[p.id] = []; continue; }
    const rawCode = getFullManagementNumber(p.managementNumber) || ('product-' + p.id);
    const safeCode = rawCode.replace(/[^A-Za-z0-9_\-]/g, '_') || 'product';
    const names = [];
    const slice = p.images.slice(0, maxSlots);
    for(let idx=0; idx<slice.length; idx++){
      const img = slice[idx];
      const durl = await getImageDataUrl(img);
      const ext = durl ? extForDataUrl(durl) : 'jpg';
      let name = safeCode + '_' + String(idx + 1).padStart(2, '0') + '.' + ext;
      let n = 1;
      while(usedNames.has(name)){ name = safeCode + '_' + String(idx + 1).padStart(2, '0') + '_' + (++n) + '.' + ext; }
      usedNames.add(name);
      names.push(name);
    }
    map[p.id] = names;
  }
  return map;
}

function getCsvValueForZip(product, col, imageNameMap){
  if(col.type === 'image'){
    const names = imageNameMap[product.id] || [];
    return names[col.index] || '';
  }
  return getCsvValue(product, col);
}

function buildZipReadyCsvText(products, imageNameMap){
  const header = CSV_COLUMNS.map(c => csvEscape(c.header)).join(',');
  const rows = products.map(p => CSV_COLUMNS.map(c => csvEscape(getCsvValueForZip(p, c, imageNameMap))).join(','));
  return [header].concat(rows).join('\r\n');
}

function csvTextToBytesForCharset(text, charset){
  if(charset === 'sjis'){
    if(typeof Encoding !== 'undefined' && !window.__sjisUnavailable){
      const arr = Encoding.convert(Encoding.stringToCode(text), { to:'SJIS', from:'UNICODE' });
      return new Uint8Array(arr);
    }
    showToast('Shift-JIS変換ライブラリを利用できません。UTF-8 BOMで出力します');
    return new TextEncoder().encode('\uFEFF' + text);
  }
  if(charset === 'utf8bom') return new TextEncoder().encode('\uFEFF' + text);
  return new TextEncoder().encode(text);
}

// 出力状態を記録する（ZIP生成が成功した商品だけ）。失敗した商品は「未出力」のままにする。
async function markProductsExported(products){
  const now = Date.now();
  for(const p of products){
    p.exportStatus = 'exported';
    p.exportedAt = now;
    p.exportDeviceId = state.deviceId;
    try{
      await productsCollection().doc(p.id).set(
        { exportStatus: 'exported', exportedAt: now, exportDeviceId: state.deviceId },
        { merge: true }
      );
    }catch(e){
      console.error('出力状態の記録に失敗しました', e);
    }
  }
}

// targetProducts省略時は現在絞り込み表示中の全商品が対象になる（呼び出し側で決定する）
async function downloadAuctownReadyZip(targetProducts){
  const products = targetProducts || state.products;
  if(typeof JSZip === 'undefined' || window.__jszipUnavailable){
    showToast('ZIP作成ライブラリを読み込めませんでした。通信環境を確認してください');
    return;
  }
  if(!products.length){
    showToast('対象の商品がありません');
    return;
  }
  const withErrors = products.filter(p => computeErrors(p).errors.length > 0);
  if(withErrors.length){
    showToast(withErrors.length + '件の商品に未解決のエラーがあります（内容を確認しつつ作成を続けます）');
  }

  showToast('オークタウン用ZIPを作成しています…（' + products.length + '件）');
  const imageNameMap = await computeZipImageFilenames(products);
  const csvText = buildZipReadyCsvText(products, imageNameMap);

  const zip = new JSZip();
  const now = new Date();
  const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
  const csvFilename = 'auction_listing_data_' + stamp + '.csv';

  zip.file(csvFilename, csvTextToBytesForCharset(csvText, state.settings.csvCharset));

  for(const p of products){
    const names = imageNameMap[p.id] || [];
    const slice = p.images.slice(0, names.length);
    for(let idx=0; idx<slice.length; idx++){
      const durl = await getImageDataUrl(slice[idx]);
      if(!durl) continue;
      zip.file(names[idx], dataUrlToUint8Array(durl));
    }
  }

  try{
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'auction_listing_data_' + stamp + '.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    // ZIP生成が成功した場合のみ「出力済み」として記録し、一覧から見えなくする
    await markProductsExported(products);
    state.hideExportedFromList = true;
    render();
    showToast('オークタウン用ZIPを作成しました（' + products.length + '件）。そのままオークタウンへアップロードできます');
  }catch(e){
    console.error(e);
    showToast('ZIPの作成に失敗しました。出力状態は変更していません: ' + e.message);
  }
}

// ============ PC向け：絞り込み・複数選択・選択商品のZIP出力 ============

function getVisibleProducts(){
  // hideExportedFromList: 出力成功直後、出力済み商品を一覧から隠す（データは削除しない。フィルターで「出力済み」を
  // 選べばいつでも再表示できる）。Firestoreとのリアルタイム同期と競合しないよう、実データは消さない設計にしている。
  if(state.hideExportedFromList) return state.products.filter(p => p.exportStatus !== 'exported');
  return state.products;
}

function getFilteredProducts(){
  const base = state.filterMode === 'exported' ? state.products : getVisibleProducts(); // 「出力済み」フィルター選択中は非表示設定を無視する
  return base.filter(p => {
    if(state.filterMode === 'thisDevice') return p.createdByDeviceId === state.deviceId;
    if(state.filterMode === 'unexported') return p.exportStatus !== 'exported';
    if(state.filterMode === 'exported') return p.exportStatus === 'exported';
    return true;
  });
}

function getExportTargets(){
  const filtered = getFilteredProducts();
  if(state.selectedForExport.size > 0){
    return filtered.filter(p => state.selectedForExport.has(p.id));
  }
  return filtered; // 何も選択していない場合は、絞り込み表示中の全件を対象にする
}

async function handleExportSelectedZip(){
  const targets = getExportTargets();
  if(!targets.length){ showToast('対象の商品がありません'); return; }
  const alreadyExported = targets.filter(p => p.exportStatus === 'exported');
  if(alreadyExported.length){
    state.reexportConfirmIds = targets.map(p => p.id);
    render();
    return;
  }
  await downloadAuctownReadyZip(targets);
}

function renderApplianceSpecificFields(p){
  const kind = getApplianceKind(p);
  if(kind === 'vacuum'){
    return `
    <div class="card">
      <h3>掃除機の動作確認</h3>
      <p class="card-desc">商品説明の「□商品詳細」に自動反映されます。初期値は〇です。</p>
      <div class="field-row">
        ${renderOkNgToggle(p, 'powerCheck', '電源が入るか')}
        ${renderOkNgToggle(p, 'brushCheck', 'ヘッドのブラシが回転するか')}
        ${renderOkNgToggle(p, 'suctionCheck', '吸い込みに問題がないか')}
      </div>
      <div class="field" style="margin-top:8px;">
        <label>備考</label>
        <textarea data-action="edit-vacuum-note" rows="3" placeholder="例：吸い込みがやや弱いです">${escapeHtml(p.vacuumNote)}</textarea>
        <p class="hint">空欄の場合、説明文には「・備考」とだけ表示されます。</p>
      </div>
    </div>`;
  }
  if(kind === 'ricecooker'){
    const capacityLabel = p.riceCookerCapacity || '（AI解析待ち）';
    return `
    <div class="card">
      <h3>炊飯器の情報</h3>
      <p class="card-desc">合数はAI解析結果から自動判定されます（型番の数字だけからの単純推測はしていません）。確認・手動修正してください。</p>
      <div class="field-row">
        <div class="field" style="max-width:220px;">
          <label>炊飯容量（合数）</label>
          <input type="text" data-action="edit-rice-capacity" value="${escapeAttr(p.riceCookerCapacity)}" placeholder="例：5.5合">
          <p class="hint">現在の値：${escapeHtml(capacityLabel)}</p>
        </div>
        <div class="field" style="max-width:220px;">
          <label>箱サイズ</label>
          <select data-action="edit-shipping-size">
            <option value="" ${!p.shippingSize?'selected':''}>未設定</option>
            <option value="100サイズ" ${p.shippingSize==='100サイズ'?'selected':''}>100サイズ</option>
            <option value="140サイズ" ${p.shippingSize==='140サイズ'?'selected':''}>140サイズ</option>
          </select>
          <p class="hint">${p.shippingSizeManual ? '手動設定中（合数を変更しても自動では変わりません）' : '合数から自動設定されます'}</p>
        </div>
      </div>
      <div class="field" style="margin-top:8px;">
        <label>備考</label>
        <textarea data-action="edit-rice-note" rows="3" placeholder="例：内釜に薄い傷があります">${escapeHtml(p.riceCookerNote)}</textarea>
        <p class="hint">空欄の場合、説明文には「・備考」とだけ表示されます。</p>
      </div>
    </div>`;
  }
  return '';
}

function renderOkNgToggle(p, key, label){
  const val = p[key] || '〇';
  return `
  <div class="field" style="max-width:220px;">
    <label>${label}</label>
    <div class="btn-row">
      <button class="btn ${val==='〇'?'accent':''}" data-action="set-ok-ng" data-key="${key}" data-value="〇">〇</button>
      <button class="btn ${val==='×'?'accent':''}" data-action="set-ok-ng" data-key="${key}" data-value="×">×</button>
    </div>
  </div>`;
}

function renderAiTab(p){
  let banner = '';
  if(p.aiStatus==='loading') banner = `<div class="ai-status-banner loading"><span class="spinner"></span> 解析中…</div>`;
  else if(p.aiStatus==='done') banner = `<div class="ai-status-banner done">解析済み。内容を確認・修正してください。</div>`;
  else if(p.aiStatus==='error') banner = `<div class="ai-status-banner error">${escapeHtml(p.aiError || '解析エラー')}</div>`;
  else banner = `<div class="ai-status-banner idle">「解析する」を押すと型番・メーカー・製造年を判別します。未解析でも下記フォームに直接入力できます。</div>`;

  return `
  <div class="card">
    <h3>商品情報</h3>
    <p class="card-desc">写真の銘板・ラベルから読み取れた情報のみを表示します。信頼度が低い項目は必ずご確認ください。</p>
    ${banner}
    ${p.aiNotes ? `<div class="warn-box"><h4>AIからの確認メッセージ</h4><ul><li>${escapeHtml(p.aiNotes)}</li></ul></div>` : ''}
    <div class="btn-row" style="margin-bottom:16px;">
      <button class="btn accent" data-action="run-ai" ${p.aiStatus==='loading'?'disabled':''}>${p.aiStatus==='loading' ? '解析中…' : (p.aiStatus==='done' ? '再解析する' : '解析する')}</button>
      <span class="hint">画像は最大10枚まで解析に使用されます</span>
    </div>
    <div class="info-grid">
      <div class="field">
        <label>型番 * ${confidenceBadge(p.confidence.modelNumber)}</label>
        <input type="text" data-action="edit-info" data-key="modelNumber" value="${escapeAttr(p.info.modelNumber)}" placeholder="未認識（手入力可）">
      </div>
      <div class="field">
        <label>メーカー *（例：HITACHI 日立）${confidenceBadge(p.confidence.manufacturer)}</label>
        <input type="text" data-action="edit-info" data-key="manufacturer" value="${escapeAttr(p.info.manufacturer)}" placeholder="未認識（手入力可）">
      </div>
      <div class="field">
        <label>製造年（西暦4桁） ${confidenceBadge(p.confidence.productionYear)}</label>
        <input type="text" data-action="edit-info" data-key="productionYear" value="${escapeAttr(p.info.productionYear)}" placeholder="不明の場合は空欄">
      </div>
    </div>
  </div>
  <div class="card">
    <h3>商品カテゴリ ${confidenceBadge(p.categoryConfidence)}</h3>
    <p class="card-desc">写真の形状・構造からAIが自動判別し、対応するYahoo!オークションのカテゴリIDをCSVへ出力します。誤っている場合は下のプルダウンから手動で選び直せます。</p>
    <div class="field" style="max-width:420px;">
      <label>カテゴリ *</label>
      <select data-action="edit-category">
        <option value="">未選択（手動で選んでください）</option>
        ${CATEGORY_OPTIONS.map(c=>`<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${escapeHtml(c.label)}（${c.id}）</option>`).join('')}
      </select>
      ${p.categoryId ? `<div class="hint">出力されるカテゴリID：${escapeHtml(p.categoryId)}</div>` : '<div class="hint warn">カテゴリが未確定です。CSV作成前に選択してください。</div>'}
      ${p.categoryReasoning ? `<div class="hint">AIの判断理由：${escapeHtml(p.categoryReasoning)}</div>` : ''}
    </div>
  </div>
  ${renderApplianceSpecificFields(p)}
  <div class="card">
    <h3>生成商品名</h3>
    <p class="card-desc">${getApplianceKind(p)==='other' ? `テンプレート「${escapeHtml(state.settings.titleTemplate)}」から自動生成されます。` : `「${getApplianceKind(p)==='vacuum'?'掃除機':'炊飯器'}」専用の形式で自動生成されます。`}編集すると商品説明の冒頭も自動的に同期されます。</p>
    <div class="field">
      <textarea data-action="edit-title" rows="2">${escapeHtml(p.title)}</textarea>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" data-action="regen-title">商品名を再生成</button>
        <button class="btn ghost" data-action="copy-title">コピー</button>
      </div>
    </div>
  </div>`;
}

    unexported: state.products.filter(p=>p.exportStatus!=='exported').length,
    exported: state.products.filter(p=>p.exportStatus==='exported').length

  return `

    ${batchHtml}

        <button class="btn" data-action="back-to-editor">← 編集に戻る</button>

    </div>

          <button class="filter-chip ${state.filterMode==='all'?'active':''}" data-action="set-filter" data-filter="all">すべて（${filterCounts.all}）</button>

          <button class="filter-chip ${state.filterMode==='unexported'?'active':''}" data-action="set-filter" data-filter="unexported">未出力（${filterCounts.unexported}）</button>

      </div>

      <div class="card" style="border-left:3px solid var(--accent);">

        <div class="field-row" style="align-items:flex-end;">
          <div class="field" style="max-width:260px;">
            <label>文字コード</label>
            <select data-action="set-charset">
              <option value="utf8" ${state.settings.csvCharset==='utf8'?'selected':''}>UTF-8</option>
              <option value="utf8bom" ${state.settings.csvCharset==='utf8bom'?'selected':''}>UTF-8（BOM付き）</option>
              <option value="sjis" ${state.settings.csvCharset==='sjis'?'selected':''}>Shift-JIS</option>

          </div>
          <div class="field" style="flex:none;"><button class="btn accent" data-action="export-selected-zip">選択した商品をZIP出力（${targets.length}件）</button></div>

        ${targets.some(p=>p.images.length>0 && !getFullManagementNumber(p.managementNumber)) ? '<p class="hint warn">管理番号が未入力の商品の画像ファイル名は "product-〇〇" になります。事前に管理番号を入力しておくことをお勧めします。</p>' : ''}

      </div>
      <div class="card">
        <h3>画像のCSV埋め込み</h3>
        <p class="card-desc">アップロードした画像をBase64データとして「画像1」〜「画像10」列にそのまま埋め込みます（画像の並び順どおりに出力されます）。ファイルサイズが大きくなるため、必要に応じて枚数を絞ってください。</p>
        <div class="field-row" style="align-items:flex-end;">
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);">
            <input type="checkbox" data-action="toggle-include-images" ${state.settings.includeImagesInCsv?'checked':''}>
            画像をCSVに埋め込む
          </label>
          <div class="field" style="max-width:160px;">
            <label>埋め込む最大枚数</label>
            <input type="number" min="1" max="10" data-action="edit-csv-image-count" value="${escapeAttr(state.settings.csvImageCount)}" ${state.settings.includeImagesInCsv?'':'disabled'}>
          </div>
        </div>
        <p class="hint ${estimateEmbeddedImageBytes() > 15*1024*1024 ? 'warn' : ''}">推定CSVサイズ（画像込み）：約 ${formatBytes(estimateEmbeddedImageBytes())}${estimateEmbeddedImageBytes() > 15*1024*1024 ? '　※かなり大きなファイルになります。オークタウン側の取り込み上限にご注意ください。' : ''}</p>
        <p class="hint warn">多くのCSV取り込みシステムは、Base64埋め込みではなく画像URLでの指定を前提としています。オークタウン側でこの形式が読み込めない場合は、画像を別途アップロードしてURLを取得し、そのURLを貼り付ける方式への切り替えをご検討ください。</p>
      </div>
      <div class="card">
        <h3>CSVダウンロード</h3>
        <div class="field-row" style="align-items:flex-end;">
          <div class="field" style="max-width:260px;">
            <label>文字コード</label>
            <select data-action="set-charset">
              <option value="utf8" ${state.settings.csvCharset==='utf8'?'selected':''}>UTF-8</option>
              <option value="utf8bom" ${state.settings.csvCharset==='utf8bom'?'selected':''}>UTF-8（BOM付き）</option>
              <option value="sjis" ${state.settings.csvCharset==='sjis'?'selected':''}>Shift-JIS</option>
            </select>
          </div>
          <div class="field" style="flex:none;"><button class="btn accent" data-action="download-csv">CSVを作成してダウンロード</button></div>
        </div>
        <p class="hint">ファイル名は「auction-listing-data_YYYYMMDD_HHMM.csv」の形式です。「カテゴリ」列にはAIが判定したカテゴリID（例：2084230968）がテキストとしてそのまま出力されます。Excelで開くと桁数の大きい数値の見え方が変わる場合がありますが、CSV内部のデータ自体は変更されません。</p>
      </div>
      <div class="card">
        <h3>商品画像フォルダ</h3>
        <p class="card-desc">アップロードした画像を、商品番号ごとのフォルダに振り分けて出力します。画像ファイル名はリネームせずそのまま使えます（フォルダ名だけが商品番号になります）。Windows版一括ツール（auctown-bulk-csv-tool）の「商品画像フォルダ」欄にそのまま指定できる構造です。</p>

          <button class="btn ${supportsDirectFolderSave() ? '' : 'accent'}" data-action="download-image-zip">画像フォルダをZIPでダウンロード</button>

function renderConfirmCard(p){
  const { errors } = computeErrors(p);
  const isMine = p.createdByDeviceId === state.deviceId;
  const isExported = p.exportStatus === 'exported';
  const isChecked = state.selectedForExport.has(p.id);
  return `
  <div class="confirm-card ${errors.length?'err':''}">
    <div class="cc-head">
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" data-action="toggle-select-export" data-id="${p.id}" ${isChecked?'checked':''} title="ZIP出力の対象に含める">
        <h4>${escapeHtml(p.title) || '（商品名未設定）'}</h4>
      </div>
      <div class="btn-row">
        <span class="export-badge ${isExported?'exported':'unexported'}">${isExported?'出力済み':'未出力'}</span>
        ${isMine ? '<span class="mine-badge" title="この端末で作成">この端末で作成</span>' : ''}
        <button class="small-btn" data-action="edit-from-confirm" data-id="${p.id}">編集</button>
        <button class="small-btn danger" data-action="delete-product" data-id="${p.id}">削除</button>
      </div>
    </div>
    ${errors.length ? `<div class="error-box" style="margin-bottom:10px;"><h4>修正が必要な項目</h4><ul>${errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>` : ''}
